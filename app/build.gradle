plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'androidx.navigation.safeargs'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'org.jlleitschuh.gradle.ktlint'
}

kotlin {
    jvmToolchain {
        version = "17"
    }
}

android {
    namespace "com.jim.moviecritics"
    compileSdk 36

    signingConfigs {
        release {
            // Load from local.properties (or your own file)
            def props = new Properties()
            props.load(rootProject.file('local.properties').newDataInputStream())

            def ksFile   = props.getProperty('key.store.file')
            def ksPass   = props.getProperty('key.store.password')
            def alias    = props.getProperty('key.alias')
            def aliasPas = props.getProperty('key.password')

            storeFile    = file(ksFile)
            storePassword = ksPass
            keyAlias     = alias
            keyPassword  = aliasPas
        }
    }

    defaultConfig {
        applicationId "com.jim.moviecritics"
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        // Input local properties
        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        def tmdbAPIKey = properties.getProperty('key.api.tmdb')

        debug {
            signingConfig signingConfigs.release
            buildConfigField("Boolean", "LOGGER_VISIBLE", "true")
            // BuildConfig could be used in java code
            buildConfigField "String", "API_KEY_TMDB", tmdbAPIKey
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField("Boolean", "LOGGER_VISIBLE", "false")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // BuildConfig could be used in java code
            buildConfigField "String", "API_KEY_TMDB", tmdbAPIKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        compose = true
        // Determines whether to generate a BuildConfig class.
        buildConfig = true
        viewBinding = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.9"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.08.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    // Jetpack Compose Integration
    implementation 'androidx.navigation:navigation-compose:2.9.3'

    // Material 3
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material3:material3-window-size-class:1.3.2'
    // Material Design 2
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.annotation:annotation:1.9.1'

    // Kotlin
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.3'
    // Feature module Support
    implementation 'androidx.navigation:navigation-dynamic-features-fragment:2.9.3'
    // Testing Navigation
    androidTestImplementation 'androidx.navigation:navigation-testing:2.9.3'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Paging
    implementation "androidx.paging:paging-runtime-ktx:3.3.6"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.10.3"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    // Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    //implementation 'io.fabric.sdk.android:fabric:1.4.8'
    // Google login
    implementation "com.google.android.gms:play-services-auth:21.4.0"
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Retrofit with Moshi Converter
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-moshi:3.0.0"
    // Retrofit Logging Interceptor
    implementation('com.squareup.okhttp3:logging-interceptor:5.1.0')
    // Moshi
    implementation "com.squareup.moshi:moshi:1.15.2"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    // Moshi Codegen
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'

    // Gson
    implementation "com.google.code.gson:gson:2.13.1"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    ksp 'com.github.bumptech.glide:ksp:4.16.0'

    // Lottie: 動畫效果
    implementation "com.airbnb.android:lottie:6.6.7"

    // Radar Chart: 雷達圖
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
}

ktlint {
    android.set(true)
    outputColorName.set("RED")
}