plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'androidx.navigation.safeargs'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'org.jlleitschuh.gradle.ktlint'
}

ext {
    majorVersion = 1
    minorVersion = 1
    patchVersion = 6

    weightMajor = 1000000
    weightMinor = 100000
    weightPatch = 1000

    weightProd = 999
    weightBeta = 800

    preReleaseProd = "r"
    preReleaseBeta = "b"
    betaVersion = 1

    flavorProd = "production"
    flavorDev = "dev"

    nameProd = "MovieCritics"
    nameDev = "DEV_MovieCritics"
}

Integer getVersionCode(String flavor) {
    println("> Getting version code for flavor: ${flavor}")

    def V = project.ext

    def ret = (V.majorVersion * V.weightMajor) + (V.minorVersion * V.weightMinor) + (V.patchVersion * V.weightPatch)
    println(">> Calculated base version code: ${ret}")

    switch (flavor) {
        case V.flavorProd:
            def code = ret + V.weightProd
            println("-> versionCode: ${code}")
            return code

        case V.flavorDev:
            def code = ret + V.weightBeta + V.betaVersion
            println("-> versionCode: ${code}")
            return code

        default:
            def code = ret + V.betaVersion
            println("-> versionCode: ${code}")
            return code
    }
}

String getVersionName(String flavor) {
    println("> Getting version name for flavor: ${flavor}")

    def V = project.ext
    def fullVersion = "${V.majorVersion}.${V.minorVersion}.${V.patchVersion}"
    println(">> Calculated full version name: ${fullVersion}")

    if (flavor == V.flavorProd) {
        println("-> versionName: ${fullVersion}")
        return "${fullVersion}"
    } else {
        def name = "${fullVersion}${V.preReleaseBeta}${V.betaVersion}"
        println("-> versionName: ${name}")
        return name
    }
}

kotlin {
    jvmToolchain {
        version = "17"
    }
}

android {
    namespace "com.jim.moviecritics"
    compileSdk 36
    flavorDimensions += "default"

    signingConfigs {
        release {
            // Load from local.properties (or your own file)
            def props = new Properties()
            props.load(rootProject.file('local.properties').newDataInputStream())

            def ksFile = props.getProperty('key.store.file')
            def ksPass = props.getProperty('key.store.password')
            def alias = props.getProperty('key.alias')
            def aliasPas = props.getProperty('key.password')

            storeFile = file(ksFile)
            storePassword = ksPass
            keyAlias = alias
            keyPassword = aliasPas
        }
    }

    defaultConfig {
        applicationId "com.jim.moviecritics"
        minSdk 26
        targetSdk 36
        // DO NOT call getVersionCode()/getVersionName() with no args here.
        // Either leave placeholders (overridden later) or use the Variant API.
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        def V = project.ext

        // Input local properties
        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        def API_KEY = properties.getProperty('key.api.tmdb')

        production {
            versionCode getVersionCode(V.flavorProd)
            versionName getVersionName(V.flavorProd)
            buildConfigField("Boolean", "LOGGER_VISIBLE", "false")
            buildConfigField("String", "API_KEY_TMDB", API_KEY)
        }

        dev {
            versionCode getVersionCode(V.flavorDev)
            versionName getVersionName(V.flavorDev)
            applicationIdSuffix ".dev"
            buildConfigField("Boolean", "LOGGER_VISIBLE", "true")
            buildConfigField("String", "API_KEY_TMDB", API_KEY)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        compose = true
        // Determines whether to generate a BuildConfig class.
        buildConfig = true
        viewBinding = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.9"
    }
}

