androidComponents {
    def V = project.ext

    onVariants(selector().all()) { variant ->
        // This debug message helps confirm the block is running
        println(">> Configuring variant name: ${variant.name}")

        // Loop through all outputs for the variant (e.g., a universal APK)
        variant.outputs.each { output ->
            def baseName

            // Check for the 'production' flavor
            if (variant.flavorName == 'production') {
                // Get versionName from the 'output' object and call .get()
                baseName = "${V.nameProd}-${output.versionName.get()}"
            }
            // Check for the 'dev' flavor
            else if (variant.flavorName == 'dev') {
                // Get versionName from the 'output' object and call .get()
                baseName = "${V.nameDev}-${output.versionName.get()}"
            }

            // Configure the output for the current variant if a baseName was set
            if (baseName != null) {
                println("-> Base name is: ${baseName}")

                def finalName = "${baseName}-${variant.name}"
                println("-> Setting output name to: ${finalName}")

                output.outputFileName.set("${finalName}.apk")
            }
        }
    }
}

// Handle AAB naming separately with tasks
tasks.configureEach { task ->
    def V = project.ext

    if (task.name.startsWith('bundle')) {
        task.doLast {
            // Get the variant name from task name
            def variantName = task.name.replace('bundle', '')
            println(">> Post-processing AAB for variant name: ${variantName}")

            def flavor = ""
            def buildType = ""

            if (variantName.contains('DevRelease')) {
                flavor = "dev"
                buildType = "release"
            } else if (variantName.contains('DevDebug')) {
                flavor = "dev"
                buildType = "debug"
            } else if (variantName.contains('ProductionRelease')) {
                flavor = "production"
                buildType = "release"
            } else if (variantName.contains('ProductionDebug')) {
                flavor = "production"
                buildType = "debug"
            }

            if (flavor && buildType) {
                def outputDir = file("${flavor}/${buildType}")
                println("-> Output directory: ${outputDir}")

                if (outputDir.exists()) {
                    println("-> Output directory exists. Listing files...")

                    outputDir.listFiles().each { file ->
                        println("-> Found file: ${file.name}")

                        if (file.name.endsWith('.aab')) {
                            println("-> Processing AAB file: ${file.name}")

                            def newName
                            if (variantName.contains('Production')) {
                                println("-> Detected production flavor")
                                def versionName = getVersionName(V.flavorProd)
                                println("-> Version name for production: ${versionName}")
                                newName = "${V.nameProd}-${versionName}-${variantName}.aab"
                            } else if (variantName.contains('Dev')) {
                                println("-> Detected dev flavor")
                                def versionName = getVersionName(V.flavorDev)
                                println("-> Version name for dev: ${versionName}")
                                newName = "${V.nameDev}-${versionName}-${variantName}.aab"
                            } else {
                                println("-> Unknown flavor in variant name: ${variantName}")
                            }

                            if (newName) {
                                def newFile = new File(outputDir, newName)
                                file.renameTo(newFile)
                                println("Renamed AAB: ${file.name} -> ${newName}")
                            }
                        }
                    }
                }
            }
        }
    }
}